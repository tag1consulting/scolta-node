name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Point the prompt-text identity gate at the scolta-core source checked out
      # below, so prompt-identity.test.ts actually runs in CI instead of skipping.
      SCOLTA_CORE_PROMPTS: ${{ github.workspace }}/scolta-core-src/src/prompts.rs
    strategy:
      matrix:
        node: [20, 22]
    name: test (node ${{ matrix.node }})
    steps:
      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          repository: tag1consulting/scolta-core
          ref: main
          path: scolta-core-src

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # npm ci's lock validation differs across npm versions (npm 10 vs 11,
      # and even within 11: optional peers, platform-package fan-out). Pin
      # the exact npm that generated the lockfiles so the validator always
      # matches the generator; bump both together, deliberately.
      - run: npm install -g npm@11.17.0
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run check:publish
      # Regression guard for the npm publish surface: assert `npm pack` only
      # ships paths derived from package.json `files`, and stays under a size
      # cap (~2x the measured-good artifact). See scripts/check-pack-contents.mjs.
      - run: npm run check:pack
